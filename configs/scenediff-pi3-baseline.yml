models:
  pi3:
    name: yyfz233/Pi3
    device: cuda
  sam:
    checkpoint: /home/ubuntu/projects/room-diff/third_party/scene_diff/checkpoints/sam_vit_h_4b8939.pth
    points_per_side: 32
    pred_iou_thresh: 0.7
    box_nms_thresh: 0.7
    stability_score_thresh: 0.85
    crop_n_layers: 0
    crop_n_points_downscale_factor: 1
    min_mask_region_area: 100
  dinov3:
    model_name: dinov3_vith16plus
    feature_dim: 1280
    weight_url: /home/ubuntu/projects/room-diff/checkpoints/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth
dataset:
  gt_dir: /home/ubuntu/projects/room-diff/data/scenediff_benchmark/data
  splits:
    val: /home/ubuntu/projects/room-diff/third_party/scene_diff/splits/val_split.json
    test: /home/ubuntu/projects/room-diff/third_party/scene_diff/splits/test_split.json
  resample_rate: 30
processing:
  visible_percentage: 0.5
  subsample_size: 1000000
  total_voxel_number: 200
  occlusion_threshold: -0.02
costs:
  lambda_geo: 1.0
  lambda_dino: 0.5
  lambda_dino_region_match: 0.1
detection:
  min_detection_pixel: 100
  threshold_method: max_entropy
  change_region_threshold: null
  filter_percentage_before_threshold: 0.7
  max_score: 0.5
  max_detected_objects: 1000
merging:
  geometry_distance_threshold_of_voxel_size: 2
  visual_threshold_ratio: 0.7
  geometry_threshold_ratio: 0.5
  general_threshold: 1.4
  object_similarity_threshold: 0.7
aggregation:
  mean_over_visible_region_during_cost_aggregation: true
  merge_pc_before_and_after: true
cache:
  use_cache: false
  save_cache: false
visualization:
  vis_pc: false
  save_detections: true
  save_gt_visualization: true
output:
  output_dir: output
  save_object_masks: true
